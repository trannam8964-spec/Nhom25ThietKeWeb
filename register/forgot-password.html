<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quên mật khẩu | Coffee House</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="/register/auth.css" />
  </head>
  <body>
    <main class="auth-page">
      <section class="auth-visual" aria-label="Coffee House">
        <a class="auth-brand" href="/register/login.html">
          <i class="fa-solid fa-mug-hot" aria-hidden="true"></i> Coffee House
        </a>
        <div class="visual-copy">
          <p class="eyebrow">HỖ TRỢ TÀI KHOẢN</p>
          <h1>Lấy lại quyền truy cập của bạn.</h1>
          <p>Nhập thông tin đã đăng ký để tạo mật khẩu mới.</p>
        </div>
        <span class="visual-caption"
          >Coffee, conversations, and a slower moment.</span
        >
      </section>

      <section class="auth-main">
        <div class="auth-card">
          <p class="eyebrow">KHÔI PHỤC TÀI KHOẢN</p>
          <h2>Quên mật khẩu?</h2>
          <p class="auth-subtitle">
            Xác nhận tài khoản bằng tên đăng nhập, email và số điện thoại đã
            đăng ký.
          </p>

          <form id="forgotPasswordForm">
            <div class="field">
              <label for="recoveryUsername">Tên đăng nhập</label>
              <input
                id="recoveryUsername"
                type="text"
                autocomplete="username"
                required
              />
            </div>
            <div class="field">
              <label for="recoveryEmail">Email đã đăng ký</label>
              <input
                id="recoveryEmail"
                type="email"
                autocomplete="email"
                required
              />
            </div>
            <div class="field">
              <label for="recoveryPhone">Số điện thoại đã đăng ký</label>
              <input
                id="recoveryPhone"
                type="tel"
                autocomplete="tel"
                required
              />
            </div>
            <div class="field">
              <label for="newPassword">Mật khẩu mới</label>
              <input
                id="newPassword"
                type="password"
                autocomplete="new-password"
                minlength="6"
                required
              />
            </div>
            <div class="field">
              <label for="confirmNewPassword">Nhập lại mật khẩu mới</label>
              <input
                id="confirmNewPassword"
                type="password"
                autocomplete="new-password"
                minlength="6"
                required
              />
            </div>
            <button class="primary-button" type="submit">Đổi mật khẩu</button>
            <p
              class="auth-message"
              id="forgotPasswordMessage"
              role="status"
              aria-live="polite"
            ></p>
          </form>

          <p class="auth-footer">
            <a href="/register/login.html">Quay lại đăng nhập</a>
          </p>
        </div>
      </section>
    </main>
    <script src="/shared-data.js"></script>
    <script src="/customer/Javascript/auth.js"></script>
  </body>
</html>
