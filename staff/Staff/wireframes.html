<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wireframes Staff | Coffee House</title>
    <style>
      *{box-sizing:border-box}body{margin:0;background:#f3f0ed;color:#302821;font:14px/1.45 Arial,sans-serif}.intro{padding:28px max(20px,calc((100vw - 1220px)/2));background:#fff;border-bottom:1px solid #ddd4cd}.intro h1{margin:0 0 7px;font-size:clamp(25px,4vw,36px)}.intro p{max-width:920px;margin:0;color:#766d65}.layout{max-width:1280px;margin:22px auto 50px;padding:0 18px;display:grid;grid-template-columns:225px minmax(0,1fr);gap:18px;align-items:start}.index{position:sticky;top:14px;padding:16px;background:#fff;border:1px solid #d5c9bf}.index b{display:block;margin-bottom:8px}.index a{display:block;padding:7px 0;border-top:1px solid #ece7e2;color:#584333;text-decoration:none}.index a:hover{color:#8a4e2e}.screen{margin-bottom:24px;scroll-margin-top:14px}.screen h2{margin:0 0 5px;font-size:21px}.screen>p{margin:0 0 10px;color:#766d65}.frame{overflow:hidden;background:#fff;border:1px solid #aa988a;box-shadow:0 4px 14px #41281712}.browser{height:27px;padding:0 10px;display:flex;align-items:center;gap:5px;background:#ebe7e3;border-bottom:1px solid #d3c9c1}.dot{width:7px;height:7px;border:1px solid #a99a8d;border-radius:50%}.mock{display:grid;grid-template-columns:174px minmax(0,1fr);min-height:330px}.side{padding:12px 10px;background:#f3ede8;border-right:1px solid #d5c9bf}.brand,.nav,.card,.field,.btn,.metric,.img,.row,.tile,.chart{border:1px solid #c9b9ac;background:#fff}.brand{margin-bottom:12px;padding:8px;text-align:center;font-weight:bold;color:#64432e}.nav{margin:5px 0;padding:6px 8px;font-size:11px}.nav.on{background:#eadbd0;font-weight:bold;border-color:#9d765d}.work{min-width:0;padding:15px}.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-bottom:8px;margin-bottom:12px;border-bottom:1px solid #ded6cf}.title{font-size:18px;font-weight:bold}.muted{color:#887d73;font-size:11px}.grid{display:grid;gap:8px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.card{min-width:0;padding:10px}.card h3{margin:0 0 8px;font-size:13px}.metric{padding:9px;min-height:57px;font-size:11px}.metric strong{display:block;margin-top:4px;font-size:17px}.toolbar{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.field{min-height:30px;padding:7px 8px;color:#766d65;font-size:11px}.btn{display:inline-block;padding:6px 9px;background:#f2ece7;font-size:11px;font-weight:bold}.btn.primary{background:#eadbd0;border-color:#9d765d}.table{width:100%;border-collapse:collapse;font-size:10px}.table th,.table td{padding:7px 5px;border:1px solid #d5c9bf;text-align:left}.table th{background:#f4efeb}.badge{display:inline-block;padding:3px 6px;border:1px solid #c5b5a8;background:#f8f5f2;font-size:9px}.bars{height:106px;padding:9px;display:flex;align-items:end;justify-content:space-around;gap:7px}.bars i{display:block;width:10%;background:#d5bca9;border:1px solid #b08d72}.hint{padding:8px;margin-top:8px;background:#f7f3f0;border-left:3px solid #b99478;color:#766d65;font-size:10px}.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.tile{min-height:64px;padding:8px;font-size:11px}.tile strong{display:block;margin:3px 0}.tile.empty{background:#f2f7f0;border-color:#a7b79f}.tile.booked{background:#faf4e9;border-color:#c8ae7c}.tile.busy{background:#f7ece7;border-color:#bd927c}.products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.product{padding:7px;border:1px solid #d5c9bf;background:#fff;font-size:10px}.img{height:55px;margin-bottom:5px;display:grid;place-items:center;background:#f0ece8;color:#887d73}.split{display:grid;grid-template-columns:1fr 1fr;gap:8px}.profile{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid #d5c9bf;background:#fff}.avatar{width:58px;height:58px;border:1px solid #bda999;border-radius:50%;display:grid;place-items:center;background:#f0e5dc;color:#80543d;font-size:22px}.caption{padding:9px 12px;color:#766d65;background:#fff;border-top:1px solid #e0d8d1;font-size:11px}@media(max-width:850px){.layout{grid-template-columns:1fr}.index{position:static;columns:2}.index b{column-span:all}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:540px){.index{columns:1}.mock{grid-template-columns:1fr}.side{display:none}.g2,.g3,.g4,.split{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.products{grid-template-columns:repeat(2,minmax(0,1fr))}.work{padding:10px}}
    </style>
  </head>
  <body>
    <header class="intro"><h1>Wireframe Staff — Coffee House</h1><p>Bản phác thảo các màn hình trong menu Staff. Chọn một mục bên trái để xem bố cục của trang và các thao tác chính.</p></header>
    <div class="layout">
      <nav class="index" id="screenIndex" aria-label="Danh sách wireframe"><b>Các màn hình</b></nav>
      <main id="screens"></main>
    </div>
    <script>
      const navItems = [
        ["dashboard", "Bảng điều khiển"], ["orders", "Đơn hàng"], ["tables", "Bàn"],
        ["payment", "Thanh toán"], ["menu", "Menu"], ["profile", "Hồ sơ"],
      ];
      const metric = (label, value="[00]") => `<div class="metric">${label}<strong>${value}</strong></div>`;
      const card = (title, inner) => `<div class="card"><h3>${title}</h3>${inner}</div>`;
      const field = (label) => `<div class="field">${label}</div>`;
      const table = (heads, rows=3) => `<table class="table"><thead><tr>${heads.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${Array.from({length:rows},(_,i)=>`<tr>${heads.map((_,j)=>`<td>${j===0?`[${String(i+1).padStart(2,"0")}]`:j===heads.length-1?`<span class="badge">[Trạng thái / thao tác]</span>`:`[Thông tin]`}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
      const chart = `<div class="chart"><div class="bars">${[38,66,49,82,58,92,72].map(h=>`<i style="height:${h}%"></i>`).join("")}</div><div class="muted">T2　T3　T4　T5　T6　T7　CN</div></div>`;
      const screen = (id, title, body, caption) => `<section class="screen" id="${id}"><h2>${title}</h2><p>Bố cục dự kiến theo trang ${title.toLocaleLowerCase("vi")} trong Staff.</p><div class="frame"><div class="browser"><i class="dot"></i><i class="dot"></i><i class="dot"></i></div><div class="mock"><aside class="side"><div class="brand">COFFEE HOUSE</div>${navItems.map(([key,label])=>`<div class="nav ${key===id||(id==="menu-detail"&&key==="menu")?"on":""}">${label}</div>`).join("")}</aside><div class="work"><div class="bar"><span class="title">${title}</span><span class="muted">[Tên nhân viên]　[Hồ sơ]</span></div>${body}</div></div><div class="caption">${caption}</div></div></section>`;
      const tables = Array.from({length:12},(_,i)=>`<div class="tile ${i%4===0?"busy":i%4===1?"booked":"empty"}"><strong>Bàn ${String(i+1).padStart(2,"0")}</strong>${i%4===0?"Đang sử dụng":i%4===1?"Đặt trước":"Trống"}</div>`).join("");
      const products = Array.from({length:6},(_,i)=>`<div class="product"><div class="img">Ảnh món</div><strong>[Tên sản phẩm ${i+1}]</strong><div class="muted">[Danh mục] · [Giá]</div></div>`).join("");
      const screens = [
        ["dashboard","1. Bảng điều khiển",`<div class="grid g4">${metric("Doanh thu 7 ngày","[000.000đ]")}${metric("Đơn chờ xử lý","[00]")}${metric("Đang chuẩn bị","[00]")}${metric("Bàn đang dùng","[00/12]")}</div><div class="grid g2" style="margin-top:8px">${card("Doanh thu 7 ngày",chart)}${card("Trạng thái đơn hàng",table(["TRẠNG THÁI","SỐ ĐƠN"],3))}</div><div class="grid g2" style="margin-top:8px">${card("Đơn cần xử lý",table(["MÃ ĐƠN","KHÁCH / BÀN","TRẠNG THÁI","THAO TÁC"],3))}${card("Tình trạng bàn",`<div class="tiles"><div class="tile busy"><strong>Bàn 01</strong>Đang sử dụng</div><div class="tile booked"><strong>Bàn 02</strong>Đặt trước</div><div class="tile empty"><strong>Bàn 03</strong>Trống</div></div><div class="toolbar"><span class="btn primary">Mở quản lý bàn</span></div>`)}</div>`,`Tổng quan ca làm: doanh thu, đơn cần xử lý, trạng thái đơn và tình trạng bàn; có lối tắt tới các mục liên quan.`],
        ["orders","2. Đơn hàng",`<div class="grid g3">${metric("Tổng đơn","[00]")}${metric("Chờ xác nhận","[00]")}${metric("Đang chuẩn bị","[00]")}</div><div class="toolbar">${field("Tìm mã đơn / tên khách / số điện thoại")}${field("Trạng thái　⌄")}<span class="btn">Đặt lại</span></div>${card("Danh sách đơn hàng",table(["MÃ ĐƠN","KHÁCH HÀNG","MÓN / SỐ LƯỢNG","BÀN","THỜI GIAN","TRẠNG THÁI","CẬP NHẬT"],4))}<div class="hint">Chuyển đơn theo trạng thái phục vụ: chờ xác nhận → đang chuẩn bị → đã hoàn thành.</div>`,`Tra cứu đơn, lọc trạng thái và cập nhật tiến độ xử lý.`],
        ["tables","3. Bàn",`<div class="grid g3">${metric("Tổng số bàn","12")}${metric("Bàn trống","[00]")}${metric("Đang sử dụng / đặt trước","[00]")}</div><div class="toolbar">${field("Tất cả trạng thái　⌄")}<span class="btn">Trống</span><span class="btn">Đặt trước</span><span class="btn">Đang sử dụng</span></div>${card("Sơ đồ bàn",`<div class="tiles">${tables}</div>`)}<div class="hint">Chọn một trạng thái trên thẻ bàn để cập nhật: Trống · Đặt trước · Đang sử dụng.</div>`,`Sơ đồ 12 bàn và thao tác chọn trạng thái để nhân viên nhận biết tình trạng hiện tại.`],
        ["payment","4. Thanh toán",`<div class="grid g3">${metric("Chờ thanh toán","[00]")}${metric("Đã thanh toán","[00]")}${metric("Doanh thu ca","[000.000đ]")}</div><div class="toolbar">${field("Tìm mã đơn / tên khách")}${field("Trạng thái thanh toán　⌄")}</div>${card("Đơn cần thanh toán",table(["MÃ ĐƠN","KHÁCH / BÀN","TỔNG TIỀN","PHƯƠNG THỨC","TRẠNG THÁI","THAO TÁC"],4))}<div class="hint">Thao tác chính: xem chi tiết đơn, kiểm tra tổng tiền và xác nhận đã thanh toán.</div>`,`Danh sách đơn cần thu tiền và các đơn đã thanh toán trong ca.`],
        ["menu","5. Menu",`<div class="toolbar">${field("Tìm tên món...")}${field("Tất cả danh mục　⌄")}<span class="btn">Đặt lại</span></div><div class="split">${card("Danh sách món",`<div class="products">${products}</div>`)}${card("Chi tiết món đã chọn",`<div class="img" style="height:90px">Ảnh sản phẩm</div><strong>[Tên món]</strong><p class="muted">[Danh mục] · [Giá bán]</p><p>[Mô tả ngắn về món]</p><span class="btn primary">Xem công thức</span>`)}</div>`,`Tra cứu món; chọn một sản phẩm để hiển thị thông tin chi tiết trong cùng trang Menu.`],
        ["menu-detail","5a. Chi tiết món và công thức",`<div class="split">${card("Thông tin món",`<div class="img" style="height:115px">Ảnh sản phẩm</div><h3>[Tên món]</h3><div class="muted">[Danh mục] · [Giá bán] · [Trạng thái]</div><p>[Mô tả sản phẩm]</p>`)}${card("Công thức pha chế",`<strong>Nguyên liệu</strong>${table(["NGUYÊN LIỆU","ĐỊNH LƯỢNG"],3)}<h3 style="margin-top:10px">Các bước thực hiện</h3><ol><li>[Chuẩn bị nguyên liệu]</li><li>[Pha chế theo công thức]</li><li>[Hoàn thiện và phục vụ]</li></ol>`)}</div><div class="toolbar"><span class="btn">← Trở lại danh sách món</span></div>`,`Đây là trạng thái chi tiết mở bên trong trang Menu, không phải một mục điều hướng riêng.`],
        ["profile","6. Hồ sơ nhân viên",`<div class="profile"><div class="avatar">NV</div><div><strong>[Họ tên nhân viên]</strong><div class="muted">[Mã nhân viên] · [Chức vụ]</div></div></div><div class="grid g2" style="margin-top:8px">${card("Thông tin cá nhân",table(["TRƯỜNG","THÔNG TIN"],4))}${card("Ca làm và quyền",`<div class="field">Ca làm: [Ca hiện tại]</div><div class="field" style="margin-top:7px">Quyền: [Các chức năng được phép]</div><div class="field" style="margin-top:7px">Trạng thái: [Đang làm việc]</div>`)}</div><div class="toolbar"><span class="btn">Đăng xuất</span></div>`,`Thông tin nhân viên, ca làm, quyền truy cập và thao tác đăng xuất.`],
      ];
      const index = document.getElementById("screenIndex");
      const output = document.getElementById("screens");
      screens.forEach(([id,title,body,caption])=>{
        index.insertAdjacentHTML("beforeend",`<a href="#${id}">${title}</a>`);
        output.insertAdjacentHTML("beforeend",screen(id,title,body,caption));
      });
    </script>
  </body>
</html>
