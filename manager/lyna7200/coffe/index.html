<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập | Hội An Coffee</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="login-page">
    <section class="login-card">
      <div class="brand-mark">☕</div>
      <p class="eyebrow">HỆ THỐNG QUẢN LÝ</p>
      <h1>Hội An <span>Coffee</span></h1>
      <p class="welcome">Đăng nhập để tiếp tục quản lý cửa hàng</p>
      <form id="loginForm">
        <label for="username">Tên đăng nhập</label>
        <div class="input-wrap"><span>♙</span><input id="username" name="username" autocomplete="username" placeholder="Nhập tên đăng nhập" required></div>
        <label for="password">Mật khẩu</label>
        <div class="input-wrap"><span>⌑</span><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu" required><button type="button" id="togglePassword" aria-label="Hiện mật khẩu">Hiện</button></div>
        <p id="loginError" class="error-message" role="alert"></p>
        <button class="login-button" type="submit">Đăng nhập <span>→</span></button>
      </form>
      <p class="footer-note">© Hội An Coffee · Quản lý cửa hàng</p>
    </section>
  </main>
  <script src="login.js"></script>
</body>
</html>
