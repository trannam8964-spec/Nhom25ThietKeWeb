<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wireframes Manager | Coffee House</title>
    <style>
      *{box-sizing:border-box}body{margin:0;background:#e9eef4;color:#24384e;font:14px/1.45 Arial,sans-serif}.intro{padding:28px max(20px,calc((100vw - 1220px)/2));background:#fff;border-bottom:1px solid #d4deea}.intro h1{margin:0 0 7px;font-size:clamp(25px,4vw,36px)}.intro p{max-width:920px;margin:0;color:#647991}.layout{max-width:1280px;margin:22px auto 50px;padding:0 18px;display:grid;grid-template-columns:225px minmax(0,1fr);gap:18px;align-items:start}.index{position:sticky;top:14px;padding:16px;background:#fff;border:1px solid #cbd7e4}.index b{display:block;margin-bottom:8px}.index a{display:block;padding:7px 0;border-top:1px solid #e4e9ef;color:#304b68;text-decoration:none}.index a:hover{color:#143f73}.screen{margin-bottom:24px;scroll-margin-top:14px}.screen h2{margin:0 0 5px;font-size:21px}.screen>p{margin:0 0 10px;color:#647991}.frame{overflow:hidden;background:#fff;border:1px solid #9eacbb;box-shadow:0 4px 14px #17334e12}.browser{height:27px;padding:0 10px;display:flex;align-items:center;gap:5px;background:#e4e8ec;border-bottom:1px solid #c3ccd5}.dot{width:7px;height:7px;border:1px solid #9ba7b2;border-radius:50%}.mock{display:grid;grid-template-columns:174px minmax(0,1fr);min-height:330px}.side{padding:12px 10px;background:#edf1f5;border-right:1px solid #bdc9d6}.brand,.nav,.card,.field,.btn,.metric,.img,.row,.tab,.chart,.toggle{border:1px solid #aab8c6;background:#fff}.brand{margin-bottom:12px;padding:8px;text-align:center;font-weight:bold}.nav{margin:5px 0;padding:6px 8px;font-size:11px}.nav.on{background:#dce5ee;font-weight:bold;border-color:#7088a1}.work{min-width:0;padding:15px}.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-bottom:8px;margin-bottom:12px;border-bottom:1px solid #cbd3dc}.title{font-size:18px;font-weight:bold}.muted{color:#75869a;font-size:11px}.grid{display:grid;gap:8px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.card{min-width:0;padding:10px}.card h3{margin:0 0 8px;font-size:13px}.metric{padding:9px;min-height:57px;font-size:11px}.metric strong{display:block;margin-top:4px;font-size:17px}.toolbar{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.field{min-height:30px;padding:7px 8px;color:#6c7b8a;font-size:11px}.btn{display:inline-block;padding:6px 9px;background:#e5ebf1;font-size:11px;font-weight:bold}.btn.primary{background:#d7e1eb;border-color:#7890a8}.table{width:100%;border-collapse:collapse;font-size:10px}.table th,.table td{padding:7px 5px;border:1px solid #c4ced9;text-align:left}.table th{background:#e9eef3}.badge{display:inline-block;padding:3px 6px;border:1px solid #9eacbb;background:#f2f4f6;font-size:9px}.img{min-height:75px;margin-bottom:7px;display:grid;place-items:center;background:#e8ebee;color:#718092}.bars{height:115px;padding:9px;display:flex;align-items:end;justify-content:space-around;gap:7px}.bars i{display:block;width:10%;background:#cbd6e1;border:1px solid #99aabd}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.hint{padding:8px;margin-top:8px;background:#f3f5f7;border-left:3px solid #a7b4c1;color:#647991;font-size:10px}.caption{padding:9px 12px;color:#647991;background:#fff;border-top:1px solid #d7e0e8;font-size:11px}@media(max-width:850px){.layout{grid-template-columns:1fr}.index{position:static;columns:2}.index b{column-span:all}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:540px){.index{columns:1}.mock{grid-template-columns:1fr}.side{display:none}.g2,.g3,.g4,.formgrid{grid-template-columns:1fr}.work{padding:10px}}
    </style>
  </head>
  <body>
    <header class="intro"><h1>Wireframe Manager — Coffee House</h1><p>Bản phác thảo bố cục cho các trang có trong menu Manager hiện tại. Khung xám thể hiện vị trí nội dung, bảng, biểu đồ và thao tác chính; có thể dùng để chia việc thiết kế giao diện.</p></header>
    <div class="layout">
      <nav class="index" id="screenIndex" aria-label="Danh sách wireframe"><b>Các màn hình</b></nav>
      <main id="screens"></main>
    </div>
    <script>
      const navItems = [
        ["overview", "Tổng quan"], ["products", "Sản phẩm"], ["orders", "Đơn hàng"],
        ["customers", "Khách hàng"], ["employees", "Nhân viên"], ["tables", "Bàn"],
        ["inventory", "Kho"], ["promotions", "Khuyến mãi"], ["statistics", "Thống kê"], ["settings", "Cài đặt"],
      ];
      const metric = (label, value="[00]") => `<div class="metric">${label}<strong>${value}</strong></div>`;
      const card = (title, inner) => `<div class="card"><h3>${title}</h3>${inner}</div>`;
      const field = (label) => `<div class="field">${label}</div>`;
      const table = (heads, rows=3) => `<table class="table"><thead><tr>${heads.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${Array.from({length:rows},(_,i)=>`<tr>${heads.map((_,j)=>`<td>${j===0?`[${String(i+1).padStart(2,"0")}]`:j===heads.length-1?`<span class="badge">[Trạng thái / thao tác]</span>`:`[Thông tin]`}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
      const screen = (id, title, body, caption) => `<section class="screen" id="${id}"><h2>${title}</h2><p>Bố cục dự kiến theo trang ${title.toLocaleLowerCase("vi")} trong Manager.</p><div class="frame"><div class="browser"><i class="dot"></i><i class="dot"></i><i class="dot"></i></div><div class="mock"><aside class="side"><div class="brand">COFFEE HOUSE</div>${navItems.map(([key,label])=>`<div class="nav ${key===id?"on":""}">${label}</div>`).join("")}</aside><div class="work"><div class="bar"><span class="title">${title}</span><span class="muted">Quản trị viên　[Hồ sơ]</span></div>${body}</div></div><div class="caption">${caption}</div></div></section>`;
      const chart = `<div class="chart"><div class="bars">${[38,66,49,82,58,92,72].map(h=>`<i style="height:${h}%"></i>`).join("")}</div><div class="muted">T2　T3　T4　T5　T6　T7　CN</div></div>`;
      const screens = [
        ["overview","1. Tổng quan",`<div class="grid g4">${metric("Doanh thu hôm nay","[000.000đ]")}${metric("Tổng đơn","[00]")}${metric("Khách hàng","[00]")}${metric("Sản phẩm","[32]")}</div><div class="grid g2" style="margin-top:8px">${card("Doanh thu 7 ngày",chart)}${card("Doanh thu theo danh mục",`<div class="img">Biểu đồ tròn / chú giải danh mục</div>`)}</div><div class="grid g3" style="margin-top:8px">${card("Sản phẩm bán chạy",table(["SẢN PHẨM","ĐÃ BÁN"],3))}${card("Đơn hàng theo trạng thái",table(["TRẠNG THÁI","SỐ ĐƠN"],3))}${card("Doanh thu theo tháng",chart)}</div>`,`Các thẻ KPI dẫn vào trang liên quan; biểu đồ tóm tắt doanh thu, nhóm hàng và tình trạng đơn.`],
        ["products","2. Sản phẩm",`<div class="grid g4">${metric("Tổng sản phẩm","[32]")}${metric("Đang kinh doanh","[32]")}${metric("Ngừng kinh doanh","[00]")}${metric("Danh mục","[05]")}</div><div class="toolbar">${field("Tìm tên / mã sản phẩm")}${field("Danh mục　⌄")}${field("Trạng thái　⌄")}<span class="btn">Đặt lại</span><span class="btn primary">+ Thêm sản phẩm</span></div>${card("Danh sách sản phẩm",`<div class="toolbar"><span class="btn">Xuất CSV</span></div>${table(["MÃ SP","TÊN SẢN PHẨM","DANH MỤC","GIÁ","TRẠNG THÁI","THAO TÁC"],4)}`)}<div class="hint">Biểu mẫu thêm/sửa: tên, danh mục, giá, hình ảnh, mô tả và trạng thái.</div>`,`Trang quản lý sản phẩm gồm thống kê nhanh, bộ lọc, bảng, xuất CSV và biểu mẫu thêm/sửa.`],
        ["orders","3. Đơn hàng",`<div class="grid g4">${metric("Tổng đơn","[00]")}${metric("Hoàn thành","[00]")}${metric("Doanh thu","[000.000đ]")}${metric("Đang xử lý","[00]")}</div><div class="toolbar">${field("Tìm mã đơn / tên khách")}${field("Trạng thái　⌄")}<span class="btn">Đặt lại</span><span class="btn primary">+ Tạo đơn hàng</span></div>${card("Danh sách đơn hàng",table(["MÃ ĐƠN","KHÁCH HÀNG","SẢN PHẨM","HÌNH THỨC","NGÀY ĐẶT","TỔNG","TRẠNG THÁI","THAO TÁC"],4))}<div class="hint">Biểu mẫu tạo/sửa gồm khách, sản phẩm, số lượng, hình thức bán, trạng thái và ghi chú.</div>`,`Đơn mới xếp đầu; quản lý có thể lọc, tạo/sửa đơn và cập nhật trạng thái.`],
        ["customers","4. Khách hàng",`<div class="grid g4">${metric("Tổng khách","[00]")}${metric("Có đơn hàng","[00]")}${metric("Tổng đơn","[00]")}${metric("Tổng chi tiêu","[000.000đ]")}</div><div class="toolbar">${field("Tìm tên / điện thoại / email")}<span class="btn">Đặt lại</span><span class="btn primary">+ Thêm khách hàng</span></div>${card("Danh sách khách hàng",table(["MÃ KHÁCH","HỌ TÊN","ĐIỆN THOẠI","EMAIL","SỐ ĐƠN","CHI TIÊU","THAO TÁC"],4))}<div class="hint">Biểu mẫu: họ tên, số điện thoại, email và địa chỉ.</div>`,`Trang khách hàng cho phép tra cứu và cập nhật hồ sơ cùng lịch sử chi tiêu.`],
        ["employees","5. Nhân viên",`<div class="grid g2">${metric("Tổng nhân viên","[00]")}${metric("Đang làm việc","[00]")}</div><div class="toolbar">${field("Tìm tên / số điện thoại")}<span class="btn primary">+ Thêm nhân viên</span></div>${card("Danh sách nhân viên",table(["MÃ NV","HỌ TÊN","ĐIỆN THOẠI","CHỨC VỤ","TRẠNG THÁI","THAO TÁC"],4))}<div class="hint">Biểu mẫu: họ tên, số điện thoại, chức vụ và trạng thái.</div>`,`Danh sách và biểu mẫu quản lý nhân viên.`],
        ["tables","6. Bàn",`<div class="grid g3">${metric("Tổng bàn","[12]")}${metric("Bàn trống","[00]")}${metric("Đang sử dụng","[00]")}</div><div class="toolbar">${field("Tìm tên bàn / khu vực")}<span class="btn">Đặt lại</span><span class="btn primary">+ Thêm bàn</span></div>${card("Danh sách bàn",table(["MÃ BÀN","TÊN BÀN","KHU VỰC","TRẠNG THÁI","THAO TÁC"],4))}<div class="hint">Trạng thái bàn: Trống · Đặt trước · Đang sử dụng.</div>`,`Quản lý trạng thái và thông tin bàn.`],
        ["inventory","7. Kho",`<div class="grid g2">${metric("Mặt hàng trong kho","[00]")}${metric("Sắp hết hàng","[00]")}</div><div class="toolbar">${field("Tìm nguyên liệu")}<span class="btn primary">+ Thêm nguyên liệu</span></div>${card("Danh sách nguyên liệu",table(["MÃ NL","TÊN NGUYÊN LIỆU","TỒN KHO","ĐƠN VỊ","TRẠNG THÁI","THAO TÁC"],4))}<div class="hint">Biểu mẫu: tên nguyên liệu, số lượng tồn và đơn vị tính.</div>`,`Theo dõi tồn kho và mặt hàng sắp hết.`],
        ["promotions","8. Khuyến mãi",`<div class="grid g2">${metric("Tổng chương trình","[00]")}${metric("Đang áp dụng","[00]")}</div><div class="toolbar">${field("Tìm tên chương trình / mã")}${field("Trạng thái　⌄")}<span class="btn primary">+ Thêm khuyến mãi</span></div>${card("Danh sách khuyến mãi",table(["MÃ KM","CHƯƠNG TRÌNH","ƯU ĐÃI","HẠN DÙNG","TRẠNG THÁI","THAO TÁC"],4))}<div class="hint">Biểu mẫu: tên, điều kiện, số lượng tối thiểu, loại và mức giảm, hạn dùng.</div>`,`Danh sách chiến dịch ưu đãi và thiết lập điều kiện áp dụng.`],
        ["statistics","9. Thống kê",`<div class="toolbar">${field("Từ ngày　[dd/mm/yyyy]")}${field("Đến ngày　[dd/mm/yyyy]")}<span class="btn primary">Áp dụng</span></div><div class="grid g3">${metric("Doanh thu","[000.000đ]")}${metric("Số đơn","[00]")}${metric("Món bán chạy","[Tên món]")}</div><div class="grid g2" style="margin-top:8px">${card("Doanh thu theo thời gian",chart)}${card("Tỷ lệ theo danh mục",`<div class="img">Biểu đồ tỷ trọng danh mục</div>`)}</div><div style="margin-top:8px">${card("Sản phẩm bán chạy",table(["HẠNG","SẢN PHẨM","SỐ LƯỢNG","DOANH THU"],4))}</div>`,`Bộ lọc khoảng thời gian, chỉ số chính và biểu đồ doanh thu/sản phẩm.`],
        ["settings","10. Cài đặt",`<div class="grid g2">${card("Thông tin cửa hàng",`${field("Tên quán")}${field("Số điện thoại")}${field("Địa chỉ")}${field("Mật khẩu Wi-Fi")}`)}${card("Thanh toán & hóa đơn",`${field("Thuế VAT (%)")}${field("Đơn vị tiền tệ　⌄")}${field("□ Tự động in hóa đơn")}${field("□ In thông tin Wi-Fi trên hóa đơn")}`)}</div><div class="toolbar"><span class="btn primary">Lưu cấu hình</span></div>`,`Cập nhật thông tin cửa hàng và tùy chọn hóa đơn.`],
      ];
      const index = document.getElementById("screenIndex");
      const output = document.getElementById("screens");
      screens.forEach(([id,title,body,caption])=>{
        const number = title.split(".")[0];
        index.insertAdjacentHTML("beforeend",`<a href="#${id}">${title}</a>`);
        output.insertAdjacentHTML("beforeend",screen(id,title,body,caption));
      });
    </script>
  </body>
</html>
